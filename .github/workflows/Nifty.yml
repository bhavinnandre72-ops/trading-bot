name: Nifty Auto Trading Bot

on:
  schedule:
    - cron: '30 3 * * *' # किंवा तुमच्या वेळेनुसार
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # <--- ही ओळ असणे अत्यंत आवश्यक आहे!

      - name: Run Nifty Bot
        run: python nifty_bot.py # (किंवा तुमची मुख्य फाईलचे नाव)
        
