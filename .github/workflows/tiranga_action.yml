name: Tiranga Bot Daily Run

on:
  schedule:
    # सकाळी 9:30 AM IST साठी
    - cron: '30 3 * * 1-5'
    
    # दुपारी 3:00 वाजता अचूक ॲलर्ट मिळण्यासाठी वेळ थोडी आधी (IST दुपारी 2:25 म्हणजेच UTC 8:55) सेट केली आहे
    - cron: '55 8 * * 1-5'

  workflow_dispatch:

jobs:
  run-tiranga-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas yfinance pytz

      - name: Run Tiranga Bot
        run: |
          python tiranga_bot.py
