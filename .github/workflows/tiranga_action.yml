name: Tiranga Bot Daily Run

on:
  schedule:
    # सकाळी 9:30 AM IST (UTC सकाळी 4:00)
    - cron: '0 4 * * 1-5'
    
    # दुपारी 3:00 PM IST (UTC सकाळी 9:30) - हा वेळेवर स्कॅनिंग करेल
    - cron: '30 9 * * 1-5'

  workflow_dispatch:

jobs:
  run-tiranga-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas yfinance pytz

      - name: Run Tiranga Bot
        run: |
          python tiranga_bot.py
          
