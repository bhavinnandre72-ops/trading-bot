name: Tiranga Bot Daily Run

on:
  schedule:
    # Sakaali 9:30 AM IST (UTC 4:00) - Bot Active / Status check
    - cron: '0 4 * * 1-5'
    
    # Dupari 3:00 PM IST (UTC 9:30) - Tiranga Pattern Live Scan Alert
    - cron: '30 9 * * 1-5'

  workflow_dispatch:

jobs:
  run-tiranga-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas yfinance

      - name: Run Tiranga Bot
        run: |
          python tiranga_bot.py
          
