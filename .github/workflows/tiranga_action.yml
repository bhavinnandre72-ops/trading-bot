name: Tiranga Bot Daily Run

on:
  schedule:
    # १. सकाळी ९:३० वाजता (IST) बॉट ॲक्टिव्ह झाल्याचा मेसेज पाठवण्यासाठी (UTC सकाळी ४:०० वाजता)
    - cron: '0 4 * * 1-5'
    
    # २. दुपारी ३:०० वाजता (IST) तिरंगा पॅटर्न स्कॅन करून अलर्ट पाठवण्यासाठी (UTC सकाळी ९:३० वाजता)
    - cron: '30 9 * * 1-5'

  workflow_dispatch:

jobs:
  run-tiranga-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas yfinance

      - name: Run Tiranga Bot
        run: |
          python tiranga_bot.py
          
