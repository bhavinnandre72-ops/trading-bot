name: Tiranga Bot Daily Run

on:
  schedule:
    - cron: '0 4 * * 1-5'    # सकाळी 9:30 AM IST (बॉट ॲक्टिव्ह मेसेजसाठी)
    - cron: '30 9 * * 1-5'   # दुपारी 3:00 PM IST (तिरंगा पॅटर्न स्कॅनिंग आणि ॲलर्टसाठी)

  workflow_dispatch:

jobs:
  run-tiranga-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas yfinance pytz

      - name: Run Tiranga Bot
        run: |
          python tiranga_bot.py
          
