name: Tiranga Bot Daily Run

on:
  schedule:
    - cron: '30 9 * * 1-5'
  workflow_dispatch:  # हे नवीन बटण ऍड करण्यासाठी

jobs:
  run-tiranga-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas yfinance

      - name: Run Tiranga Bot
        run: |
          python tiranga_bot.py
          
