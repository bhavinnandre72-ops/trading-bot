name: Commodity Algo Bot

on:
  schedule:
    # दर १५ मिनिटांनी बॉट ऑटोमॅटिक रन होईल 
    - cron: '*/15 * * * *'
  workflow_dispatch: # मॅन्युअली (हाोताहात) रन करण्यासाठी ऑप्शन

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install smartapi-python pandas numpy requests ta logzero

      - name: Run Trading Bot
        run: |
          python commodity_algo.py
