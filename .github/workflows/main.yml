name: Nifty Auto Trading Bot

on:
  workflow_dispatch: # हे असल्यामुळे मॅन्युअल 'Run workflow' बटण दिसते
  schedule:
    - cron: '30 3 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Main Trading Bot
        run: python main.py  # <--- इथे nifty_bot.py ऐवजी 'main.py' असायला हवे!
        
