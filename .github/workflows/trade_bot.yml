name: Nifty Sensex Auto Trading Bot

on:
  workflow_dispatch: # मॅन्युअल 'Run workflow' करण्यासाठी
  schedule:
    - cron: '30 3 * * *' # दररोज मार्केट सुरू होण्याच्या वेळेस ऑटो रन

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Main Trading Bot
        run: python main.py
        
